<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug统计系统</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="time-display" id="currentTime"></div>
    
    <header>
        <div class="header-content">
            <h1>Bug统计系统</h1>
            <div class="header-actions">
                <span class="user-info" id="userInfo">访客</span>
                <button class="header-button" id="dashboardBtn" onclick="app.showDashboard()">仪表盘</button>
                <button class="header-button" id="userManagementBtn" onclick="app.showUserManagement()" style="display: none;">用户管理</button>
                <button class="header-button logout" id="logoutBtn" onclick="app.handleLogout()" style="display: none;">登出</button>
            </div>
        </div>
    </header>

    <main class="container" id="appContainer">
        <div class="loading-container">
            <div class="spinner"></div>
            <p class="loading-text">加载中...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bug统计系统. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/apiClient.js"></script>
    <script src="js/dataService.js"></script>
    <script src="js/uiRenderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
